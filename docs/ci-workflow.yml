# Reference copy of the enforced CI/CD gate.
#
# Phase 5A (FIX-001) moved this file's definition into
# .github/workflows/deploy.yml. The workflow now runs on every pull request and
# on every push to main; Pages deploy is limited to a push to main after the
# gate is green. This copy is kept for review and for the QA tests that read the
# full gate from docs/.
#
# Gate order:
#   1 dependency installation      2 TypeScript typecheck
#   3 Vitest unit/integration      4 generated-code compile, run and Jest execution
#   5 Vite production build        6 Playwright E2E
#   7 result artifacts upload      8 GitHub Pages build + deploy (main only)
#
# A missing optional toolchain is reported as SKIP with its reason by the QA
# runner; a check that could run and failed fails the job. Toolchains named in
# QA_REQUIRED_TOOLCHAINS are installed below and fail the gate when absent;
# an all-skipped generated project is SKIP/artifact, never PASS. There is no
# continue-on-error anywhere, and `deploy` needs `build`.

name: ADOP0001 quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  E2E_DOWNLOADS: ${{ github.workspace }}/qa-artifacts
  JUNIT_VERSION: 1.11.3
  QA_JUNIT_JAR: ${{ github.workspace }}/.qa-tools/junit-platform-console-standalone.jar
  QA_REQUIRED_TOOLCHAINS: python3,pytest,gcc,g++,go,javac,junit,jest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

      - name: Install generated-code QA toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ golang-go default-jdk-headless
          python3 -m pip install --upgrade pytest
          mkdir -p "$(dirname "$QA_JUNIT_JAR")"
          curl -fsSL -o "$QA_JUNIT_JAR" \
            "https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/${JUNIT_VERSION}/junit-platform-console-standalone-${JUNIT_VERSION}.jar"

      - name: Toolchain report
        run: |
          set -eu
          node --version
          npm --version
          gcc --version | head -n 1
          g++ --version | head -n 1
          python3 --version
          python3 -m pytest --version
          npx jest --version
          javac -version
          go version
          echo "Toolchains in QA_REQUIRED_TOOLCHAINS must be present; the QA runner fails the gate otherwise."

      - name: Generated-code QA
        run: npm run qa:generated

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            .qa-out
            .playwright-artifacts
            qa-artifacts
          if-no-files-found: ignore

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
